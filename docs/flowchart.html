<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISBL Baseline Flowchart</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--box:#f4f6fa;--line:#4a5568;--io:#e8f3ec;--out:#fff4e0;--sub:#555}
@media (prefers-color-scheme:dark){:root{--bg:#15171c;--fg:#eceff4;--box:#242933;--line:#9aa5b8;--io:#1f3329;--out:#3a2f1a;--sub:#aab}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Arial,sans-serif}
h1{font-size:20px;text-align:center;margin:16px 0 0}
p.n{text-align:center;color:var(--sub);font-size:13px;margin:4px 16px 0}
svg{display:block;margin:0 auto;max-width:100%;height:auto}
.b{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.io{fill:var(--io);stroke:var(--line);stroke-width:1.5}
.out{fill:var(--out);stroke:var(--line);stroke-width:1.5}
.t{fill:var(--fg);font-size:14px;font-weight:600;text-anchor:middle}
.s{fill:var(--sub);font-size:12px;text-anchor:middle}
.a{stroke:var(--line);stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#h)}
.side{fill:var(--sub);font-size:12px}
</style></head><body>
<h1>ISBL baseline: how the code runs (Lang-1)</h1>
<p class="n">Start at the top. Dotted arrows show the order. Each box names the file that does the work.</p>
<svg viewBox="0 0 620 1030" role="img" aria-label="Flowchart of the ISBL baseline pipeline from demo script to results">
<defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>

<rect class="io" x="160" y="10" width="300" height="56" rx="26"/>
<text class="t" x="310" y="34">START: demo.ps1</text><text class="s" x="310" y="52">scripts/run/demo.ps1 (sets Java 8 + Python 3.7)</text>
<path class="a" d="M310 66 V96"/>

<rect class="b" x="110" y="96" width="400" height="56" rx="8"/>
<text class="t" x="310" y="120">Checkout, compile, run tests</text><text class="s" x="310" y="138">smoke_lang1.sh: buggy code in work-lang/ -> 1 test fails</text>
<path class="a" d="M310 152 V182"/>

<rect class="io" x="110" y="182" width="400" height="56" rx="8"/>
<text class="t" x="310" y="206">INPUT: config + bug report</text><text class="s" x="310" y="224">lang1_k50.json (k=0.5) + data/bug_reports/Lang-1.json</text>
<path class="a" d="M310 238 V268"/>

<rect class="b" x="110" y="268" width="400" height="56" rx="8"/>
<text class="t" x="310" y="292">Conductor: pipeline.py</text><text class="s" x="310" y="310">reads 108 .java files, calls the steps below in order</text>
<path class="a" d="M310 324 V354"/>

<text class="side" x="20" y="352">STEP A: IR</text>
<rect class="b" x="110" y="354" width="400" height="56" rx="8"/>
<text class="t" x="310" y="378">Rank files by similarity to report</text><text class="s" x="310" y="396">ir.py: word vectors + cosine -> NumberUtils.java is #1 of 108</text>
<path class="a" d="M310 410 V440"/>

<rect class="b" x="110" y="440" width="400" height="56" rx="8"/>
<text class="t" x="310" y="464">Keep top k% of files</text><text class="s" x="310" y="482">ir.py select_top_k: k=50% -> 54 files kept</text>
<path class="a" d="M310 496 V526"/>

<text class="side" x="20" y="524">STEP B: Spectrum</text>
<rect class="b" x="110" y="526" width="400" height="56" rx="8"/>
<text class="t" x="310" y="550">Run 173 tests with coverage</text><text class="s" x="310" y="568">CoverageRunner.java + JaCoCo -> data/coverage/Lang-1.tsv</text>
<path class="a" d="M310 582 V612"/>

<rect class="b" x="110" y="612" width="400" height="56" rx="8"/>
<text class="t" x="310" y="636">Build spectrum, drop other files</text><text class="s" x="310" y="654">spectrum.py: ef/ep/nf/np per line, keep only the 54 files</text>
<path class="a" d="M310 668 V698"/>

<text class="side" x="20" y="696">STEP C: Score</text>
<rect class="b" x="110" y="698" width="400" height="56" rx="8"/>
<text class="t" x="310" y="722">Score every line</text><text class="s" x="310" y="740">sfl.py: Ochiai and DStar -> 6 lines tie at the top</text>
<path class="a" d="M310 754 V784"/>

<rect class="b" x="110" y="784" width="400" height="56" rx="8"/>
<text class="t" x="310" y="808">Rank the lines</text><text class="s" x="310" y="826">ranking.py: sort by score, break ties (worst-case)</text>
<path class="a" d="M310 840 V870"/>

<text class="side" x="20" y="868">STEP D: Check</text>
<rect class="b" x="110" y="870" width="400" height="56" rx="8"/>
<text class="t" x="310" y="894">Compare with the real buggy lines</text><text class="s" x="310" y="912">metrics.py: rank, TOP@1/3/5, MRR (answer key = git diff)</text>
<path class="a" d="M310 926 V956"/>

<rect class="out" x="110" y="956" width="400" height="60" rx="26"/>
<text class="t" x="310" y="980">END: results/raw/Lang-1_k0.5.json + .csv</text><text class="s" x="310" y="998">rank 6, TOP@1/3/5 = 0, MRR = 0.1667</text>
</svg></body></html>
